name: decision_ai
description: "Typed decisions (jev-style) in Flutter: choice, noul and score answered by on-device or in-browser models of any family, or by any Decision API provider."
version: 1.0.0
homepage: https://lukitaduarte.github.io/decision_ai/
repository: https://github.com/Lukitaduarte/decision_ai
issue_tracker: https://github.com/Lukitaduarte/decision_ai/issues
topics:
  - ai
  - machine-learning
  - onnx
  - on-device
  - llm
screenshots:
  - description: The example app on an iPhone XR, with Dinah-0 and SmolLM2 answering typed questions on the device.
    path: screenshots/iphone-demo.gif
platforms:
  android:
  ios:
  web:

environment:
  sdk: ^3.10.9
  flutter: ">=3.38.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.5
  http: ^1.6.0
  path_provider: ^2.1.6
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

